{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div style="max-width:400px; margin:3rem auto;">
  <div class="card">
    <h1>Iniciar sesión</h1>
    <form method="post">
      <label>Correo electrónico</label>
      <input type="email" name="correo" required placeholder="tu@correo.com">
      <label>Contraseña</label>
      <input type="password" name="password" required>
      <button class="btn btn-primary" style="width:100%">Ingresar</button>
    </form>
    <p style="margin-top:1rem; font-size:.85rem; text-align:center;">
      ¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a>
    </p>
    <hr style="margin:1rem 0; border:none; border-top:1px solid #eee;">
    <p style="font-size:.78rem; color:#888; text-align:center;">
      Admin: admin@gimnasio.com / admin123
    </p>
  </div>
</div>
{% endblock %}
